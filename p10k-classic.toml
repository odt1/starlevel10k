# Off, as in Starship's defaults. Set disabled = false to show it.
[memory_usage]
disabled = true
format = '[](fg:sep bg:bg)[ ($ram( | $swap) )$symbol](fg:252 bg:bg)'
symbol = '󰍛 '

# Off: p10k shows this only while you type a matching command (kubectl, az, gcloud),
# Starship would show it all the time. The same goes for azure and gcloud below.
[kubernetes]
disabled = true
format = '[](fg:sep bg:bg)[ ($context( /$namespace) )$symbol](fg:134 bg:bg)'
symbol = '󱃾 '

[aws]
format = '[](fg:sep bg:bg)[ ($profile( $region) )$symbol](fg:208 bg:bg)'
symbol = ' '

[gcloud]
disabled = true
format = '[](fg:sep bg:bg)[ ($project )$symbol](fg:32 bg:bg)'
symbol = '󱇶 '

[openstack]
format = '[](fg:sep bg:bg)[ ($cloud( \($project\)) )$symbol](fg:178 bg:bg)'
symbol = ' '

[azure]
disabled = true
format = '[](fg:sep bg:bg)[ ($subscription )$symbol](fg:32 bg:bg)'
symbol = ' '

# Off, as in Starship's defaults. Set disabled = false to show it.
[nats]
