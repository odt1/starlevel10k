format = '[](fg:sep bg:bg)[ ($name )$symbol](fg:134 bg:bg)'
symbol = ' '

# Off, as in Starship's defaults. Set disabled = false to show it.
[mise]
disabled = true
format = '[](fg:sep bg:bg)[ ($health )$symbol](fg:134 bg:bg)'
symbol = 'mise '

[crystal]
format = '[](fg:sep bg:bg)[ ($version )$symbol](fg:160 bg:bg)'
symbol = ' '
version_format = '${raw}'

[container]
format = '[](fg:sep bg:bg)[ ($name )$symbol](fg:178 bg:bg)'
symbol = ' '

[singularity]
format = '[](fg:sep bg:bg)[ ($env )$symbol](fg:32 bg:bg)'
symbol = ' '

[netns]
format = '[](fg:sep bg:bg)[ ($name )$symbol](fg:32 bg:bg)'
symbol = '󰛳 '

# Off, as in Starship's defaults. Set disabled = false to show it.
[localip]
disabled = true
format = '[](fg:sep bg:bg)[ ($localipv4 )](fg:178 bg:bg)'

# Off, as in Starship's defaults. Set disabled = false to show it.
[shlvl]
disabled = true
format = '[](fg:sep bg:bg)[ ($shlvl )$symbol](fg:178 bg:bg)'
symbol = '󰹍 '

# Off, as in Starship's defaults. Set disabled = false to show it.
[shell]
disabled = true
format = '[](fg:sep bg:bg)[ $indicator ](fg:252 bg:bg)'

# Off, as in Starship's defaults. Set disabled = false to show it.
[sudo]
disabled = true
format = '[](fg:sep bg:bg)[ $symbol](fg:32 bg:bg)'
symbol = ' '

# Battery, shown below 10%, as in Starship's defaults.
[battery]
format = '[](fg:sep bg:bg)[ $percentage $symbol]($style)'
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
unknown_symbol = '󰂑 '
empty_symbol = '󰂎 '
display = [{ threshold = 10, style = 'bold fg:160 bg:bg' }]

# user@host, shown for root and over SSH.
[username]
format = '[](fg:sep bg:bg)[ $user]($style)'
style_user = 'fg:180 bg:bg'
style_root = 'bold fg:178 bg:bg'

[hostname]
format = '[@$hostname]($style)'
style = 'fg:180 bg:bg'
ssh_only = true
ssh_symbol = ''

[time]
disabled = true
time_format = '%H:%M:%S'
format = '[](fg:sep bg:bg)[ $time ](fg:66 bg:bg)'
