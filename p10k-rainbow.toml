[fill]
symbol = ' '
style = 'fg:frame'

# Current directory. The repository root is shown in bold, like p10k's anchors.
[directory]
format = '[ $read_only]($read_only_style)[$path]($style)[ ](bg:dir)'
repo_root_format = '[ $read_only]($read_only_style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[ ](bg:dir)'
style = 'bold fg:231 bg:dir'
before_repo_root_style = 'fg:253 bg:dir'
repo_root_style = 'bold fg:231 bg:dir'
read_only = '󰌾 '
read_only_style = 'fg:253 bg:dir'
truncation_length = 7
truncation_symbol = '…/'
truncate_to_repo = false

# Git branch, then the commit when HEAD is detached, an operation in progress and the
# status counters.
[git_branch]
format = '[](fg:prev_bg bg:git)[ $symbol$branch](fg:16 bg:git)([:](fg:22 bg:git)[$remote_branch](fg:16 bg:git))[ ](bg:git)'
symbol = ''
only_attached = true
truncation_length = 32
truncation_symbol = '…'

[git_commit]
format = '[](fg:prev_bg bg:git)[ @](fg:22 bg:git)[$hash](fg:16 bg:git)([ #](fg:22 bg:git)[$tag](fg:16 bg:git))[ ](bg:git)'
commit_hash_length = 8
tag_disabled = false
tag_symbol = ''

[git_state]
format = '[$state( $progress_current/$progress_total) ](fg:124 bg:prev_bg)'
rebase = 'rebase'
merge = 'merge'
revert = 'revert'
cherry_pick = 'cherry-pick'
bisect = 'bisect'
am = 'am'
am_or_rebase = 'am/rebase'

# The counters for a dirty work tree get their own yellow part, the rest stays green.
[git_status]
format = '$ahead_behind$stashed([](fg:prev_bg bg:git_dirty)[ ](bg:git_dirty)$conflicted$staged$modified$renamed$deleted)$untracked'
ahead = '[↑${count} ](fg:16 bg:prev_bg)'
behind = '[↓${count} ](fg:16 bg:prev_bg)'
diverged = '[↓${behind_count}↑${ahead_count} ](fg:16 bg:prev_bg)'
up_to_date = ''
stashed = '[*${count} ](fg:16 bg:prev_bg)'
conflicted = '[~${count} ](fg:124 bg:prev_bg)'
staged = '[+${count} ](fg:16 bg:prev_bg)'
modified = '[!${count} ](fg:16 bg:prev_bg)'
renamed = '[»${count} ](fg:16 bg:prev_bg)'
deleted = '[${count} ](fg:16 bg:prev_bg)'
untracked = '[?${count} ](fg:16 bg:prev_bg)'

# Lines added and deleted. Off, as in Starship's defaults.
[git_metrics]
disabled = true
format = '([+$added ](fg:16 bg:prev_bg))([-$deleted ](fg:16 bg:prev_bg))'

[vcsh]
format = '[](fg:prev_bg bg:vcsh)[ vcsh $repo ](fg:16 bg:vcsh)'

# Fossil, Mercurial and Pijul. Off, as in Starship's defaults.
[fossil_branch]
disabled = true
format = '[](fg:prev_bg bg:git)[ $symbol$branch ](fg:16 bg:git)'
symbol = ''

[fossil_metrics]
disabled = true
format = '([+$added ](fg:16 bg:prev_bg))([-$deleted ](fg:16 bg:prev_bg))'

[hg_branch]
disabled = true
format = '[](fg:prev_bg bg:git)[ $symbol$branch(:$topic) ](fg:16 bg:git)'
symbol = ''

[hg_state]
disabled = true
format = '[$state ](fg:124 bg:prev_bg)'

[pijul_channel]
disabled = true
format = '[](fg:prev_bg bg:git)[ $symbol$channel ](fg:16 bg:git)'
symbol = ''

# Exit status: a check mark after success, the exit code and a cross after an error. It
# always comes first on the right and draws the right head.
[status]
disabled = false
format = '$symbol'
success_symbol = '[](fg:status_ok)[  ](fg:76 bg:status_ok)'
symbol = '[](fg:status_error)[ $status  ](fg:226 bg:status_error)'

# How long the last command took, from 3 seconds on.
[cmd_duration]
min_time = 3000
format = '[](fg:duration bg:prev_bg)[ $duration ](fg:231 bg:duration)'

[jobs]
format = '[](fg:jobs bg:prev_bg)[ $symbol ](fg:231 bg:jobs)'
symbol = ''

# Disabled because it runs direnv before every prompt. Set disabled = false if you use
# direnv.
[direnv]
disabled = true
format = '[](fg:direnv bg:prev_bg)[ $symbol ](fg:16 bg:direnv)'
symbol = ''

# Tools and toolchains, shown inside projects that use them. The list, its order and
