# Powerlevel10k Rainbow style for Starship, made with configure.html from p10k-starship.
# Needs Starship 1.26 or newer and a Nerd Font.
#
# Answers:
#   Prompt Style              Rainbow
#   Prompt Colors             256 colors
#   Show current time?        No
#   Prompt Separators         Angled
#   Prompt Heads              Sharp
#   Prompt Tails              Flat
#   Prompt Height             Two lines
#   Prompt Connection         Disconnected
#   Prompt Frame              Full
#   Frame Color               Light
#   Prompt Spacing            Sparse
#   Icons                     Few icons
#   Icon Set                  Nerd Font
#   Icon Padding              None
#   Prompt Flow               Concise
#   Enable Transient Prompt?  No
#
# To change them, open configure.html, click "Load settings from a file" and pick this
# file. It reads them from the next line.
# p10k-starship: style=rainbow&colors=256&time=none&separators=angled&heads=sharp&tails=flat&lines=2&connection=disconnected&frame=full&color=2&spacing=sparse&icons=few&symbols=nerd&padding=none&flow=concise&transient=no

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'p10k'

# Line 1: left segments, the connection and right segments. Line 2: where you type.
# $env_var and ${custom} show your own env_var and custom modules; give them a format in
# the same style.
format = """
[╭─](fg:frame)\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
[](fg:prev_bg)\
$fill\
$status\
$cmd_duration\
$jobs\
$direnv\
$docker_context\
$package\
$bun\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$kubernetes\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$mise\
$crystal\
$env_var\
${custom}\
$container\
$singularity\
$netns\
$localip\
$shlvl\
$shell\
$sudo\
$battery\
($username$hostname[ ](bg:prev_bg))\
$time\
[─╮](fg:frame)\
$line_break\
[╰─ ](fg:frame)"""

# Next to the line you type on. PowerShell needs p10k-starship.ps1 for this.
right_format = '[─╯](fg:frame)'

