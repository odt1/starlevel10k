[fill]
symbol = ' '
style = 'fg:frame'

# Prompt character: green after success, red after an error.
[character]
format = '$symbol '
success_symbol = '[❯](fg:prompt_ok)'
error_symbol = '[❯](fg:prompt_error)'
vimcmd_symbol = '[❮](fg:prompt_ok)'
vimcmd_visual_symbol = '[V](fg:prompt_ok)'
vimcmd_replace_symbol = '[▶](fg:prompt_ok)'
vimcmd_replace_one_symbol = '[▶](fg:prompt_ok)'

# Current directory. The repository root is shown in bold, like p10k's anchors.
[directory]
format = '[$read_only]($read_only_style)[$path]($style)'
repo_root_format = '[$read_only]($read_only_style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)'
style = 'bold fg:dir_anchor'
before_repo_root_style = 'fg:dir'
repo_root_style = 'bold fg:dir_anchor'
read_only = '󰌾 '
read_only_style = 'fg:dir'
truncation_length = 7
truncation_symbol = '…/'
truncate_to_repo = false

# Git branch, then the commit when HEAD is detached, an operation in progress and the
# status counters.
[git_branch]
format = ' [$symbol$branch](fg:git_clean)(:[$remote_branch](fg:git_clean))'
symbol = ''
only_attached = true
truncation_length = 32
truncation_symbol = '…'

[git_commit]
format = ' @[$hash](fg:git_clean)( #[$tag](fg:git_clean))'
commit_hash_length = 8
tag_disabled = false
tag_symbol = ''

[git_state]
format = ' [$state( $progress_current/$progress_total)](fg:git_conflicted)'
rebase = 'rebase'
merge = 'merge'
revert = 'revert'
cherry_pick = 'cherry-pick'
bisect = 'bisect'
am = 'am'
am_or_rebase = 'am/rebase'

[git_status]
format = '$ahead_behind$stashed$conflicted$staged$modified$renamed$deleted$untracked'
ahead = ' [↑${count}](fg:git_clean)'
behind = ' [↓${count}](fg:git_clean)'
diverged = ' [↓${behind_count}↑${ahead_count}](fg:git_clean)'
up_to_date = ''
stashed = ' [*${count}](fg:git_clean)'
conflicted = ' [~${count}](fg:git_conflicted)'
staged = ' [+${count}](fg:git_modified)'
modified = ' [!${count}](fg:git_modified)'
renamed = ' [»${count}](fg:git_modified)'
deleted = ' [${count}](fg:git_modified)'
untracked = ' [?${count}](fg:git_untracked)'

# Lines added and deleted. Off, as in Starship's defaults.
[git_metrics]
disabled = true
format = '( [+$added](fg:git_clean))( [-$deleted](fg:git_conflicted))'

[vcsh]
format = ' vcsh [$repo](fg:vcsh)'

# Fossil, Mercurial and Pijul. Off, as in Starship's defaults.
[fossil_branch]
disabled = true
format = ' [$symbol$branch](fg:git_clean)'
symbol = ''

[fossil_metrics]
disabled = true
format = '( [+$added](fg:git_clean))( [-$deleted](fg:git_conflicted))'

[hg_branch]
disabled = true
format = ' [$symbol$branch(:$topic)](fg:git_clean)'
symbol = ''

[hg_state]
disabled = true
format = ' [$state](fg:git_conflicted)'

[pijul_channel]
disabled = true
format = ' [$symbol$channel](fg:git_clean)'
symbol = ''

# Exit status. The prompt character already turns red after an error, so this only shows
# signals.
[status]
disabled = false
format = '( [ $signal_name](fg:status_error))'

# How long the last command took, from 3 seconds on.
[cmd_duration]
min_time = 3000
format = ' [$duration](fg:duration)'

[jobs]
format = ' [$symbol](fg:jobs)'
symbol = ''

# Disabled because it runs direnv before every prompt. Set disabled = false if you use
# direnv.
[direnv]
disabled = true
format = ' [$symbol](fg:direnv)'
symbol = ''

# Tools and toolchains, shown inside projects that use them. The list, its order and
# which ones are on follow Starship's defaults.
[docker_context]
format = ' [$symbol$context](fg:docker_context)'
symbol = ' '

[package]
format = ' [$symbol$version](fg:package)'
symbol = '󰏗 '
version_format = '${raw}'

[bun]
format = ' [$symbol$version](fg:bun)'
symbol = ' '
