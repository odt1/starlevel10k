# Powerlevel10k Lean style for Starship, made with configure.html from p10k-starship.
# Needs Starship 1.26 or newer and a Nerd Font.
#
# Answers:
#   Prompt Style              Lean
#   Prompt Colors             256 colors
#   Show current time?        No
#   Prompt Height             Two lines
#   Prompt Connection         Disconnected
#   Prompt Frame              No frame
#   Prompt Spacing            Sparse
#   Icons                     Few icons
#   Icon Set                  Nerd Font
#   Icon Padding              None
#   Prompt Flow               Concise
#   Enable Transient Prompt?  No
#
# To change them, open configure.html, click "Load settings from a file" and pick this
# file. It reads them from the next line.
# p10k-starship: style=lean&colors=256&time=none&lines=2&connection=disconnected&frame=none&spacing=sparse&icons=few&symbols=nerd&padding=none&flow=concise&transient=no

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'p10k'

# Line 1: left segments, the connection and right segments. Line 2: where you type.
# $env_var and ${custom} show your own env_var and custom modules; give them a format in
# the same style.
format = """
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
[ ](fg:frame)\
$fill\
$status\
$cmd_duration\
$jobs\
$direnv\
$docker_context\
$package\
$bun\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$kubernetes\
$aws\
$gcloud\
$openstack\
$azure\
$nats\
$mise\
$crystal\
$env_var\
${custom}\
$container\
$singularity\
$netns\
$localip\
$shlvl\
$shell\
$sudo\
$battery\
$username\
$hostname\
$time\
$line_break\
$character"""

