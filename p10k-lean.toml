# Battery, shown below 10%, as in Starship's defaults.
[battery]
format = ' [$symbol$percentage]($style)'
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
unknown_symbol = '󰂑 '
empty_symbol = '󰂎 '
display = [{ threshold = 10, style = 'bold fg:battery' }]

# user@host, shown for root and over SSH.
[username]
format = ' [$user]($style)'
style_user = 'fg:context'
style_root = 'bold fg:context_root'

[hostname]
format = '[@$hostname]($style)'
style = 'fg:context'
ssh_only = true
ssh_symbol = ''

[time]
disabled = true
time_format = '%H:%M:%S'
format = ' [$time](fg:time)'
